# Cloudflare Workers Builds deploys this repository directly: main -> production,
# develop -> development (once the DEVELOPMENT_ENABLED repository variable is "true").
# This workflow records each deploy to its GitHub environment: it waits for the
# Cloudflare build of the exact commit, fails if it fails, then smoke-tests the live URL.
name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  deploy:
    if: github.ref_name == 'main' || vars.DEVELOPMENT_ENABLED == 'true'
    name: ${{ github.ref_name == 'main' && 'Production' || 'Development' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      url: ${{ vars.APP_URL }}
    env:
      APP_URL: ${{ vars.APP_URL }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Wait for the Cloudflare build
        run: |
          for i in $(seq 1 80); do
            result=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
              --jq '[.check_runs[] | select(.app.slug | test("cloudflare"; "i"))] | (map(.status) | join(",")) + "|" + (map(.conclusion // "") | join(","))')
            statuses=${result%%|*}; conclusions=${result#*|}
            if [ -n "$statuses" ] && ! echo "$statuses" | grep -qv completed; then
              if echo "$conclusions" | grep -qE 'failure|cancelled|timed_out|action_required'; then
                echo "::error::Cloudflare build finished with: $conclusions"; exit 1
              fi
              echo "Cloudflare build succeeded."; exit 0
            fi
            echo "Waiting for Cloudflare (${statuses:-not started})..."
            sleep 15
          done
          echo "::warning::No completed Cloudflare build found for this commit; smoke-testing the live site anyway."

      - name: Smoke test
        run: |
          check() {
            for i in $(seq 1 10); do
              code=$(curl -s -o /dev/null -D headers.txt -w "%{http_code}" --max-time 30 "$APP_URL$1" || echo 000)
              echo "$APP_URL$1 -> $code"
              [ "$code" = "$2" ] && return 0
              # Cloudflare bot protection may challenge requests from CI data centres;
              # a challenge proves the site is up and served by Cloudflare.
              if [ "$code" = "403" ] && grep -qi '^cf-mitigated: challenge' headers.txt; then
                echo "::notice::$APP_URL$1 is up (Cloudflare challenged the CI runner)"
                return 0
              fi
              sleep 15
            done
            cat headers.txt
            echo "::error::$APP_URL$1 did not return $2"
            return 1
          }
          check / 200
          check /services/office-cleaning 200
          check /sitemap.xml 200
          check /this-page-does-not-exist 404
