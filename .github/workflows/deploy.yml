# Builds the site and deploys it to Cloudflare Workers (static assets):
# main -> production (teamsudda.lk, www.teamsudda.lk),
# develop -> development (dev.teamsudda.lk), once the DEVELOPMENT_ENABLED
# repository variable is "true". Then smoke-tests the live URL.
name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref_name == 'main' || vars.DEVELOPMENT_ENABLED == 'true'
    name: ${{ github.ref_name == 'main' && 'Production' || 'Development' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      url: ${{ vars.APP_URL }}
    env:
      APP_URL: ${{ vars.APP_URL }}
      TZ: Asia/Colombo

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_EMAILJS_SERVICE_ID: ${{ vars.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ vars.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ vars.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: ${{ github.ref_name == 'main' && 'deploy' || 'deploy --env development' }}

      - name: Smoke test
        run: |
          check() {
            for i in $(seq 1 10); do
              code=$(curl -s -o /dev/null -D headers.txt -w "%{http_code}" --max-time 30 "$APP_URL$1" || echo 000)
              echo "$APP_URL$1 -> $code"
              [ "$code" = "$2" ] && return 0
              # Cloudflare bot protection may challenge requests from CI data centres;
              # a challenge proves the site is up and served by Cloudflare.
              if [ "$code" = "403" ] && grep -qi '^cf-mitigated: challenge' headers.txt; then
                echo "::notice::$APP_URL$1 is up (Cloudflare challenged the CI runner)"
                return 0
              fi
              sleep 15
            done
            cat headers.txt
            echo "::error::$APP_URL$1 did not return $2"
            return 1
          }
          check / 200
          check /services/office-cleaning 200
          check /sitemap.xml 200
          check /this-page-does-not-exist 404
