# Records each release to its GitHub environment: main -> production,
# develop -> development (once the DEVELOPMENT_ENABLED repository variable is
# "true"). Vercel builds and serves the site directly from this
# repository; this workflow waits for that build of the exact commit, fails if
# it fails, then smoke-tests the live URL.
name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  deploy:
    if: github.ref_name == 'main' || vars.DEVELOPMENT_ENABLED == 'true'
    name: ${{ github.ref_name == 'main' && 'Production' || 'Development' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      url: ${{ vars.APP_URL }}
    env:
      APP_URL: ${{ vars.APP_URL }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Wait for the Vercel build
        run: |
          for i in $(seq 1 100); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/statuses" --jq '[.[] | select(.context == "Vercel")][0].state // ""')
            case "$state" in
              success) echo "Vercel build succeeded."; exit 0 ;;
              failure|error|cancelled|timed_out|action_required)
                echo "::error::Vercel build finished with: $state"; exit 1 ;;
            esac
            echo "Waiting for Vercel (${state:-not started})..."
            sleep 15
          done
          echo "::error::Timed out waiting for the Vercel build"
          exit 1

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -L "$APP_URL/" || echo 000)
            echo "$APP_URL -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::$APP_URL did not return 200"
          exit 1
